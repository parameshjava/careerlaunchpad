name: Deploy Production

# Preview deploys (PRs + main) are handled by Vercel's native Git integration.
# Production is gated here: it runs ONLY when a GitHub Release is published.
# A bare `git push --tags` does NOT deploy — you must publish a Release.
#
# Order matters: migrate the production DB first, then deploy the app, so new
# code never meets an old schema.
on:
  release:
    types: [published]

# Minimal token scope: these jobs only read the repo (checkout); Vercel and
# Supabase auth via their own secrets, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_ID"
      - run: supabase db push

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
