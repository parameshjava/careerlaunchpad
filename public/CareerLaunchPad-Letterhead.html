<title>CareerLaunchPad Letterhead</title>
<style>
  :root{
    --navy:#0e2f55;
    --blue:#1470c9;
    --green:#2fa04d;
    --ink:#25344a;
    --backdrop:#e9edf2;
  }
  @media (prefers-color-scheme: dark){ :root{ --backdrop:#1c2530; } }
  :root[data-theme="dark"]{ --backdrop:#1c2530; }
  :root[data-theme="light"]{ --backdrop:#e9edf2; }

  body{
    font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
    background:var(--backdrop);
    padding:24px 0;
  }
  .scroll{ overflow-x:auto; }
  .sheet{
    width:210mm; min-height:297mm;
    margin:0 auto;
    background:#fff;
    box-shadow:0 6px 32px rgba(14,47,85,.25);
    position:relative;
    display:flex; flex-direction:column;
  }

  /* ---------- header ---------- */
  .head{ position:relative; height:25mm; flex:none; }
  .head::after{ /* thin gradient rule immediately below the band */
    content:""; position:absolute; left:0; right:0; bottom:0; height:1mm;
    background:linear-gradient(90deg,var(--navy) 25%,var(--blue) 55%,var(--green));
  }
  .band{
    position:absolute; inset:0 0 auto 0; height:24mm;
    background:linear-gradient(95deg,var(--blue) 15%,var(--green) 95%);
    display:flex; align-items:center;
    padding-left:58mm;
  }
  .corner{
    position:absolute; top:0; left:0;
    width:52mm; height:25mm; /* flush with the rule's bottom edge */
    background:var(--navy);
    border-bottom-right-radius:12mm;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2mm;
    z-index:1;
  }
  .logo-chip{
    width:14mm; height:15.5mm;
    background:#fff;
    border-radius:2mm;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1mm 3mm rgba(0,0,0,.28);
    margin-right:6mm; /* optical center: corner curve eats the right side */
  }
  .logo-chip img{ width:11mm; height:auto; display:block; }
  .tagline{
    color:#cfe3d8;
    font-size:6.5pt; letter-spacing:.18em; font-weight:500;
    margin-right:6mm;
    white-space:nowrap;
  }
  .name{
    color:#fff;
    font-size:16pt; font-weight:700; letter-spacing:.06em;
    text-shadow:0 .3mm 1mm rgba(0,0,0,.18);
  }
  .name .pad{ font-weight:300; }
  .contacts{
    margin-left:auto;
    padding:0 8mm 0 5mm;
    border-left:.5mm solid rgba(255,255,255,.55);
    color:#fff; text-align:right;
    font-size:8.5pt; line-height:1.7;
  }
  .contacts a{ color:#fff; text-decoration:none; }

  /* ---------- writing area ---------- */
  .body-space{ flex:1; }

  /* ---------- footer ---------- */
  .foot{
    position:relative; height:13mm; flex:none;
    background:var(--navy);
    overflow:hidden;
  }
  .foot::before{ /* thin gradient rule sitting on the bar */
    content:""; position:absolute; top:0; left:0; right:0; height:1.2mm;
    background:linear-gradient(90deg,var(--blue),var(--green));
  }
  .foot::after{ /* gradient quarter-arc, bottom right */
    content:""; position:absolute; right:0; bottom:0;
    width:46mm; height:11mm;
    background:linear-gradient(95deg,var(--blue),var(--green));
    border-top-left-radius:100% 200%;
  }
  .foot span{
    position:absolute; left:10mm; top:50%; transform:translateY(-50%);
    color:#dbe6ef; font-size:8pt; letter-spacing:.02em;
    max-width:150mm;
    display:flex; align-items:center; gap:1.6mm;
  }
  .foot svg{ width:3.6mm; height:3.6mm; flex:none; }

  /* ---------- print ---------- */
  @page{ size:A4; margin:0; }
  @media print{
    html,body{ background:#fff; padding:0; margin:0; overflow:hidden; }
    .scroll{ overflow:visible; }
    /* 99.8vh tracks the printable area, so it stays one page even if the
       print dialog adds margins or the paper isn't exactly A4 */
    .sheet{ box-shadow:none; width:100%; height:99.8vh; min-height:0; margin:0; }
    .band,.corner,.foot,.foot::before,.foot::after{
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
  }
</style>
